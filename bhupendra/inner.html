!<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SLL - BOM Dashboard</title>

<style>
:root{
  --primary:#0b3d91;
  --primary-dark:#062b68;
  --accent:#6dbc6b;
  --bg:#eef3f8;
  --card:#ffffff;
  --text:#18212f;
  --muted:#667085;
  --border:#d9e1ea;
  --danger:#c62828;
  --shadow:0 8px 24px rgba(15,38,71,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:linear-gradient(180deg,#eef4f9 0%,#f7f9fc 100%);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
header{
  background:linear-gradient(135deg,#0b3d91 0%,#1769aa 55%,#6dbc6b 100%);
  color:#fff;
  padding:18px 20px 22px;
  text-align:center;
  box-shadow:0 4px 18px rgba(0,0,0,.14);
}
.header-inner{max-width:1250px;margin:auto}
.logo{
  display:block;
  width:min(210px,55vw);
  max-height:70px;
  object-fit:contain;
  margin:0 auto 10px;
  background:#fff;
  padding:7px 12px;
  border-radius:10px;
}
header h1{margin:0;font-size:clamp(22px,4vw,32px);letter-spacing:.3px}
header p{margin:8px 0 0;font-size:14px;opacity:.95}
.container{max-width:1250px;margin:24px auto;padding:0 16px 40px}
.search-box{
  background:var(--card);
  padding:22px;
  border-radius:16px;
  box-shadow:var(--shadow);
  border:1px solid rgba(217,225,234,.8);
}
.search-box h2{margin:0 0 18px;font-size:21px;color:var(--primary)}
.search-grid{
  display:grid;
  grid-template-columns:2fr 1fr auto;
  gap:12px;
  align-items:end;
}
.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  color:#475467;
  margin-bottom:6px;
}
input,select{
  width:100%;
  height:46px;
  padding:10px 13px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font-size:15px;
  outline:none;
  background:#fff;
  transition:.2s;
}
input:focus,select:focus{
  border-color:#1769aa;
  box-shadow:0 0 0 3px rgba(23,105,170,.12);
}
button{
  height:46px;
  padding:0 18px;
  border:0;
  border-radius:9px;
  background:var(--primary);
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
  white-space:nowrap;
}
button:hover{background:var(--primary-dark);transform:translateY(-1px)}
.search-actions{display:flex;gap:8px}
.clear-btn{background:#64748b}
.clear-btn:hover{background:#475569}
#resultCount{
  margin-top:16px;
  padding:10px 12px;
  border-radius:8px;
  background:#f1f5f9;
  color:#334155;
  font-size:14px;
  font-weight:700;
}
.bom-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
  gap:18px;
  margin-top:22px;
}
.bom-card{
  background:#fff;
  border-radius:15px;
  padding:19px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  overflow:hidden;
}
.bom-card h3{
  margin:0 0 15px;
  color:var(--primary);
  font-size:20px;
  padding-bottom:12px;
  border-bottom:2px solid #e8eef5;
}
.characteristics{margin:0}
.characteristics div{
  display:grid;
  grid-template-columns:minmax(135px,42%) 1fr;
  gap:8px;
  padding:9px 0;
  border-bottom:1px solid #edf1f5;
  line-height:1.35;
  font-size:14px;
  word-break:break-word;
}
.characteristics div:last-child{border-bottom:0}
.label{font-weight:700;color:#475467}
.value{color:#101828}
.pdf-btn{
  width:100%;
  margin-top:14px;
  background:var(--danger);
}
.pdf-btn:hover{background:#9f1f1f}
.empty{
  grid-column:1/-1;
  text-align:center;
  padding:35px 20px;
  background:#fff;
  border-radius:15px;
  box-shadow:var(--shadow);
}
.empty h3{margin:0 0 8px;color:#b42318}
.badge{
  display:inline-block;
  margin-left:8px;
  padding:3px 8px;
  border-radius:999px;
  background:#e8f5e9;
  color:#256029;
  font-size:11px;
  vertical-align:middle;
}
footer{
  text-align:center;
  color:#667085;
  font-size:12px;
  padding:8px 16px 25px;
}
@media(max-width:850px){
  .search-grid{grid-template-columns:1fr}
  .search-actions{display:grid;grid-template-columns:1fr 1fr}
  .bom-grid{grid-template-columns:1fr}
}
@media(max-width:520px){
  header{padding:15px 12px 18px}
  .container{padding:0 10px 30px;margin-top:14px}
  .search-box{padding:16px}
  .bom-card{padding:15px}
  .characteristics div{grid-template-columns:1fr;gap:3px}
  .search-actions{grid-template-columns:1fr}
}
</style>
</head>

/* =========================
   DISPLAY BOM
   ========================= */

function escapeHTML(value) {
    return String(value ?? "NA")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function displayBOM(data) {
    const list = document.getElementById("bomList");
    const count = document.getElementById("resultCount");

    list.innerHTML = "";
    count.textContent = `Found BOM: ${data.length}`;

    if (data.length === 0) {
        list.innerHTML = `
          <div class="empty">
            <h3>❌ BOM Not Found</h3>
            <p>Please check the search value or selected characteristic.</p>
          </div>`;
        return;
    }

    data.forEach(bom => {
        const rows = [
            ["1. FG Number", bom.partNo],
            ["2. DB Description", bom.dashboarddescription],
            ["3. Country", bom.country],
            ["4. Plastic DB", bom.plasticdashboard],
            ["5. Cover Cluster", bom.covercluster],
            ["6. Instrument Cluster", bom.InstrumentCluster],
            ["7. Lock Set", bom.Lockset],
            ["8. ON/OFF Label", bom.Onofflabel],
            ["9. FM Radio", bom.Fmradiolabel],
            ["10. Plug", bom.plug],
            ["11. Instruction Label", bom.label],
            ["12. Button", bom.button],
            ["13. Socket Charger", bom.shocketcharger],
            ["14. DB Colour", bom.dashboardcolour]
        ];

        const rowsHTML = rows.map(([label, value]) => `
          <div>
            <span class="label">${escapeHTML(label)}</span>
            <span class="value">${escapeHTML(value || "NA")}</span>
          </div>
        `).join("");

        list.insertAdjacentHTML("beforeend", `
          <article class="bom-card">
            <h3>📕 ${escapeHTML(bom.partNo)}
              <span class="badge">BOM</span>
            </h3>
            <div class="characteristics">${rowsHTML}</div>
            ${bom.pdf ? `
              <button class="pdf-btn" onclick="openPDF('${escapeHTML(bom.pdf)}')">
                📄 Open BOM PDF
              </button>` : ""}
          </article>
        `);
    });
}


/* =========================
   SEARCH FUNCTION
   ========================= */

function searchBOM() {

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const type =
        document.getElementById("characteristic").value;

    if (search === "") {

        displayBOM(bomData);

        return;
    }

    const result = bomData.filter(bom => {

        if (type === "all") {

            return Object.values(bom)
                .some(value =>
                    String(value)
                    .toLowerCase()
                    .includes(search)
                );

        }

        return String(bom[type])
            .toLowerCase()
            .includes(search);

    });

    displayBOM(result);
}


/* =========================
   OPEN PDF
   ========================= */

function clearSearch() {
    document.getElementById("searchInput").value = "";
    document.getElementById("characteristic").value = "all";
    displayBOM(bomData);
    document.getElementById("searchInput").focus();
}

function openPDF(fileName) {
    if (!fileName || fileName === "undefined" || fileName === "null") {
        alert("PDF file is not available for this BOM.");
        return;
    }
    window.open(fileName, "_blank", "noopener,noreferrer");
}


/* INITIAL DISPLAY */

displayBOM(bomData);
